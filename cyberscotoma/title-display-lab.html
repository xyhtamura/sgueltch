<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberScotoma Title Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@400;700&family=Averia+Gruesa+Libre&family=Syne+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./title-display-lab.css">
</head>
<body>
<main class="lab">
  <header class="mast">
    <div>
      <p class="kicker">title display lab</p>
      <h1>CyberScotoma</h1>
    </div>
    <div class="mast-sticks" aria-hidden="true">
      <i class="red"></i><i class="yellow"></i><i class="blue"></i>
    </div>
  </header>

  <section class="specimen-grid" aria-label="CyberScotoma title display specimens">
    <article class="specimen specimen-a">
      <div class="nameplate">
        <span>01</span><b>retina lead</b>
      </div>
      <h2><span>Cyber</span><span>Scotoma</span></h2>
      <div class="swatch-stick-row" aria-hidden="true">
        <i class="red"></i><i class="yellow tall"></i><i class="blue short"></i>
      </div>
    </article>

    <article class="specimen specimen-b">
      <div class="nameplate">
        <span>02</span><b>optic puncture</b>
      </div>
      <h2><span>Cyber</span><i aria-hidden="true"></i><span>Scotoma</span></h2>
      <div class="corner-sticks" aria-hidden="true">
        <i class="yellow"></i><i class="red"></i><i class="blue"></i>
      </div>
    </article>

    <article class="specimen specimen-c">
      <div class="nameplate">
        <span>03</span><b>test-field ruler</b>
      </div>
      <h2><span>Cyber</span><span>Scotoma</span></h2>
      <div class="ruler" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </article>

    <article class="specimen specimen-d">
      <div class="nameplate">
        <span>04</span><b>chromatic seep / additive</b>
      </div>
      <h2 class="seep-title" aria-label="CyberScotoma">
        <span class="seep-red" aria-hidden="true">CyberScotoma</span>
        <span class="seep-yellow" aria-hidden="true">CyberScotoma</span>
        <span class="seep-blue" aria-hidden="true">CyberScotoma</span>
      </h2>
      <div class="under-swatch" aria-hidden="true">
        <i class="red"></i><i class="yellow"></i><i class="blue"></i>
      </div>
    </article>

    <article class="specimen specimen-e">
      <div class="nameplate">
        <span>05</span><b>field occluder</b>
      </div>
      <h2><span>Cyber</span><span>Scotoma</span></h2>
      <div class="occluder" aria-hidden="true">
        <i class="red"></i><i class="yellow"></i><i class="blue"></i>
      </div>
    </article>

    <article class="specimen specimen-f">
      <div class="nameplate">
        <span>06</span><b>clinical wet chrome</b>
      </div>
      <h2><span>Cyber</span><span>Scotoma</span></h2>
      <div class="vertical-scale" aria-hidden="true">
        <i class="red"></i><i class="yellow"></i><i class="blue"></i>
      </div>
    </article>
  </section>
</main>
</body>
</html>
